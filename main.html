<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials Carousel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="testimonials">
    <div class="carousel">

        <button class="nav-btn prev-btn" aria-label="Previous testimonial">
            &#10094;
        </button>

        <div class="carousel-track">

            <div class="testimonial-card left-card"></div>

            <div class="testimonial-card active-card"></div>

            <div class="testimonial-card right-card"></div>

        </div>

        <button class="nav-btn next-btn" aria-label="Next testimonial">
            &#10095;
        </button>

    </div>
</section>

<script src="script.js"></script>

</body>
</html>
